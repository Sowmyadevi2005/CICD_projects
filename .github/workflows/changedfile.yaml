name: Changed .csproj discovery

on:
  push:
    branches: [ f1 ]      # later change to [ main ]
  pull_request:
    branches: [ f1 ]

jobs:
  changed-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show event info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref:   ${{ github.ref }}"
          echo "SHA:   ${{ github.sha }}"

      - name: Get changed files into changed_files.txt
        shell: bash
        run: |
          chmod +x scripts/get_changed_files.sh
          scripts/get_changed_files.sh \
            "${{ github.event_name }}" \
            "${{ github.event.before }}" \
            "${{ github.event.after }}" \
            "${{ github.event.pull_request.base.sha || '' }}" \
            "${{ github.event.pull_request.head.sha || '' }}" \
            > changed_files.txt

          echo "Changed files:"
          cat changed_files.txt

      - name: Find nearest .csproj for each changed file
        shell: bash
        run: |
          chmod +x scripts/find_nearest_csproj.sh
          scripts/find_nearest_csproj.sh < changed_files.txt

          echo "Final list of .csproj paths:"
          cat cs_proj_paths.txt
