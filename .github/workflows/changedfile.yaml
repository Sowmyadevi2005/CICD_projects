name: Show changed files for current branch

on:
  push:
    branches: [ f1 ]   # later change this to [ main ]
  pull_request:
    branches: [ f1 ]   # later change this to [ main ]

jobs:
  changed-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show event info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref:   ${{ github.ref }}"
          echo "SHA:   ${{ github.sha }}"

      - name: Compute changed files (push or PR)
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            echo "Push event: comparing $BEFORE..$AFTER"
            files=$(git diff --name-only --diff-filter=ACMRT "$BEFORE" "$AFTER")

          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            echo "PR event: comparing $BASE_SHA..$HEAD_SHA"
            git fetch origin "$BASE_SHA" "$HEAD_SHA" || true
            files=$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA")

          else
            echo "Unsupported event: ${{ github.event_name }}"
            files=""
          fi

          echo "Changed files (log):"
          printf '%s\n' "$files"

          # Write all paths to a file in the workspace
          printf '%s\n' "$files" > changed_files.txt

          echo "Wrote changed file paths to $(pwd)/changed_files.txt"

      - name: Use changed_files.txt (example extraction)
        shell: bash
        run: |
          echo "Contents of changed_files.txt:"
          cat changed_files.txt

          echo
          echo "Only .yaml files:"
          grep '\.yaml$' changed_files.txt || echo "No .yaml files found"

          echo
          echo "Only files under src/:"
          grep '^src/' changed_files.txt || echo "No src/ files found"
